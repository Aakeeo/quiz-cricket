server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store";      # dev: always fetch the latest export
  gzip on;
  gzip_min_length 1024;
  gzip_types application/wasm application/octet-stream application/javascript text/html;
  location / { try_files $uri $uri/ =404; }
}
